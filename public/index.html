<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QTopo · Queensland & NSW maps</title>
  <link rel="icon" href="/assets/icons/favicon.ico">
  <link rel="stylesheet" href="/vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="/viewer.css">
  <script src="/viewer.js" type="module"></script>
</head>
<body>
  <main id="map" aria-label="Topographic map"></main>
  <details class="panel" open>
    <summary><strong>QTopo</strong><span>Queensland & New South Wales</span></summary>
    <div class="controls">
      <p class="hint">One tile source for Gaia and other GPS apps. QLD and NSW maps are selected automatically by location.</p>
      <button id="copy-url" type="button">Copy QLD + NSW tile URL</button>
      <details><summary>Advanced previews</summary>
      <label for="provider">Map</label><select id="provider" aria-label="Map provider"></select>
      <label for="mode">View</label>
      <select id="mode"><option value="vector">Interactive vector map</option><option value="raster">Raster tiles / GPS preview</option></select>
      <fieldset id="layers"><legend>Show on map</legend></fieldset>
      </details>
      <label class="check"><input id="regions" type="checkbox"> Regions of interest</label>
      <p id="tile-size" class="hint"></p>
      <p id="status" role="status" aria-live="polite">Loading maps…</p>
      <p class="hint"><a href="/status">Server activity and performance →</a></p>
    </div>
  </details>
  <div id="coordinates" aria-live="off"></div>
</body>
</html>
