name: Test, build and publish
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  container:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build the Unraid image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          pull: true
          platforms: linux/amd64
          load: true
          tags: qtopo:test
          build-args: BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load the deployed styles for sustained-panning validation
        uses: actions/checkout@v7.0.1
        with:
          ref: 4e90dc8fb0bc142764998cee4f6da4e23ccea01e
          path: memory-styles
      - name: Exercise sustained panning with twenty-four workers under a four GiB cap
        run: |
          mkdir -p test-results
          docker run -d --name qtopo-memory --cpus=4 --memory=4g --memory-swap=4g --pids-limit=1024 -e RENDER_CONCURRENCY=24 -e RENDER_TIMEOUT_SECONDS=90 -e PREFETCH_RADIUS=2 qtopo:test
          for profile in readable mobile-3x mobile-light; do
            docker cp "memory-styles/styles/$profile.json" "qtopo-memory:/tmp/$profile.json"
            docker exec qtopo-memory node scripts/profiles.js sync "/tmp/$profile.json"
          done
          docker exec qtopo-memory node scripts/smoke-memory.js
          docker cp qtopo-memory:/tmp/smoke/. test-results/
          docker stop qtopo-memory
      - name: Exercise native rendering and neighbouring tile prefetch
        run: |
          mkdir -p test-results
          for pixels in 1024 512 256; do
            compression=3
            if [ "$pixels" = 256 ]; then compression=6; fi
            docker run -d --name qtopo-smoke-$pixels -e ADMIN_ALLOWED_NETWORKS=127.0.0.1/32 -e TILE_PX=$pixels -e PNG_COMPRESSION_LEVEL=$compression -e PUID=99 -e PGID=100 -e RENDER_TIMEOUT_SECONDS=90 -e PREFETCH_RADIUS=0 qtopo:test
            docker exec qtopo-smoke-$pixels node scripts/smoke.js
            docker exec qtopo-smoke-$pixels node scripts/smoke-png.js
            if [ "$pixels" = 1024 ]; then
              docker exec qtopo-smoke-$pixels node scripts/smoke-metatile.js
              docker exec qtopo-smoke-$pixels node scripts/smoke-profiles.js
              docker exec qtopo-smoke-$pixels node scripts/smoke-flyby.js
              docker exec -u 99:100 qtopo-smoke-$pixels node scripts/smoke-profile-sync.js
            fi
            docker cp qtopo-smoke-$pixels:/tmp/smoke/. test-results/
            docker stop qtopo-smoke-$pixels
          done
          docker run -d --name qtopo-prefetch -e ADMIN_ALLOWED_NETWORKS=127.0.0.1/32 -e PUID=99 -e PGID=100 -e RENDER_TIMEOUT_SECONDS=90 -e RENDER_CONCURRENCY=4 qtopo:test
          docker exec qtopo-prefetch node scripts/smoke-prefetch.js
          docker cp qtopo-prefetch:/tmp/smoke/. test-results/
          docker stop qtopo-prefetch
      - name: Container logs
        if: always()
        run: |
          mkdir -p test-results
          for pixels in 1024 512 256; do
            docker cp qtopo-smoke-$pixels:/tmp/smoke/. test-results/ 2>/dev/null || true
            docker logs qtopo-smoke-$pixels > test-results/container-$pixels.log 2>&1 || true
          done
          docker logs qtopo-prefetch > test-results/prefetch.log 2>&1 || true
          docker cp qtopo-memory:/tmp/smoke/. test-results/ 2>/dev/null || true
          docker logs qtopo-memory > test-results/memory.log 2>&1 || true
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: map-render-checks
          path: test-results/
      - uses: docker/login-action@v4.6.0
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the tested image to latest only
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          docker buildx imagetools inspect pkai3/qtopo-server:fallback | grep -E '^Digest: +sha256:c321de21fd723fea8d30e9cee16043fb662c3a5df66bdae54acfb3439c9731eb$'
          stable=$(docker buildx imagetools inspect pkai3/qtopo-server:stable | awk '/^Digest:/ {print $2}')
          [[ "$stable" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker tag qtopo:test pkai3/qtopo-server:sha-${GITHUB_SHA::7}
          docker tag qtopo:test pkai3/qtopo-server:latest
          docker push pkai3/qtopo-server:sha-${GITHUB_SHA::7}
          docker push pkai3/qtopo-server:latest
          test "$(docker buildx imagetools inspect pkai3/qtopo-server:stable | awk '/^Digest:/ {print $2}')" = "$stable"
          docker buildx imagetools inspect pkai3/qtopo-server:latest
