name: Preserve fallback and promote stable
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: promote-stable
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Preserve original image before promoting the confirmed release
        env:
          IMAGE: pkai3/qtopo-server
          FALLBACK_DIGEST: sha256:c321de21fd723fea8d30e9cee16043fb662c3a5df66bdae54acfb3439c9731eb
          STABLE_DIGEST: sha256:084289494298734ba34fc894f119bf956e2228e1e50ad3c9574f2721dcdd24e1
        run: |
          digest() { docker buildx imagetools inspect "$IMAGE:$1" | awk '/^Digest:/{print $2}'; }
          test "$(digest latest)" = "$STABLE_DIGEST"
          previous=$(digest stable)
          test "$previous" = "$FALLBACK_DIGEST" || test "$previous" = "$STABLE_DIGEST"
          backup=$(digest fallback 2>/dev/null) || backup=''
          test -z "$backup" || test "$backup" = "$FALLBACK_DIGEST"
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:fallback" "$IMAGE@$FALLBACK_DIGEST"
          test "$(digest fallback)" = "$FALLBACK_DIGEST"
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:stable" "$IMAGE@$STABLE_DIGEST"
          test "$(digest stable)" = "$STABLE_DIGEST"
          test "$(digest latest)" = "$STABLE_DIGEST"
          docker buildx imagetools inspect "$IMAGE:fallback"
          docker buildx imagetools inspect "$IMAGE:stable"
