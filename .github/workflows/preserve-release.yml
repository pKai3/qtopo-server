name: Promote approved stable image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote the approved unguarded comparison release
        shell: bash
        run: |
          set -euo pipefail
          image=pkai3/qtopo-server
          previous=sha256:0393cd2d9e38100f05c9ab47a6a537becb8c9cecdec4f55ec1153d5c1c1647e3
          approved=sha256:8068794e9898c40956068a275b4a839cf616065b1af6cec5b53bd60be390ebfe
          fallback=sha256:c321de21fd723fea8d30e9cee16043fb662c3a5df66bdae54acfb3439c9731eb
          digest() { docker buildx imagetools inspect "$image:$1" | awk '/^Digest:/ {print $2}'; }
          test "$(digest sha-5d5f2ae)" = "$approved"
          test "$(digest fallback)" = "$fallback"
          latest=$(digest latest)
          current=$(digest stable)
          test "$current" = "$previous" || test "$current" = "$approved"
          # Retag the exact tested manifests. Do not rebuild or wrap a single
          # manifest in a new index, which would change its digest.
          docker buildx imagetools create --prefer-index=false --tag "$image:stable" "$image@$approved"
          test "$(digest stable)" = "$approved"
          test "$(digest latest)" = "$latest"
          test "$(digest fallback)" = "$fallback"
          docker buildx imagetools inspect "$image:stable"
