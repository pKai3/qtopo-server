name: Promote approved stable image

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit SHA of the tested image to promote
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stable-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote the approved tested release
        shell: bash
        env:
          APPROVED_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_REVISION" =~ ^[a-f0-9]{40}$ ]]
          image=pkai3/qtopo-server
          fallback=sha256:c321de21fd723fea8d30e9cee16043fb662c3a5df66bdae54acfb3439c9731eb
          digest() { docker buildx imagetools inspect "$image:$1" | awk '/^Digest:/ {print $2}'; }
          approved=$(digest "sha-${APPROVED_REVISION:0:7}")
          [[ "$approved" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker pull "$image@$approved"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image@$approved")" = "$APPROVED_REVISION"
          test "$(digest fallback)" = "$fallback"
          latest=$(digest latest)
          # Retag the exact tested manifests. Do not rebuild or wrap a single
          # manifest in a new index, which would change its digest.
          docker buildx imagetools create --prefer-index=false --tag "$image:stable" "$image@$approved"
          test "$(digest stable)" = "$approved"
          test "$(digest latest)" = "$latest"
          test "$(digest fallback)" = "$fallback"
          docker buildx imagetools inspect "$image:stable"
